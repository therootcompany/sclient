before:
  hooks:
    - go mod download
    - go generate ./...
builds:
  - id: sclient
    binary: sclient
    main: ./cmd/sclient/
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - freebsd
      - windows
      - js
    goarch:
      - amd64
      - arm
      - arm64
      - wasm
    goarm:
      - 7
    goamd64:
      - v2
    ignore:
      - goos: windows
        goarch: 386
      - goos: windows
        goarm: 6
      - goos: windows
        goarm: 7

  - id: ssh-tls-proxy
    binary: ssh-tls-proxy
    main: ./cmd/ssh-tls-proxy/
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - freebsd
      - windows
    goarch:
      - amd64
      - arm
      - arm64
    goarm:
      - 7
    goamd64:
      - v2
    ignore:
      - goos: windows
        goarch: 386
      - goos: windows
        goarm: 6
      - goos: windows
        goarm: 7

archives:
  - id: sclient-binary
    builds: [sclient]
    format: tar.xz
    format_overrides:
      - goos: windows
        format: zip

  - id: ssh-tls-proxy-binary
    builds: [ssh-tls-proxy]
    name_template: ssh-tls-proxy_{{.Version}}_{{.Os}}_{{.Arch}}
    format: tar.xz
    format_overrides:
      - goos: windows
        format: zip
checksum:
  name_template: 'checksums.txt'
snapshot:
  name_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
