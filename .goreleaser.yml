version: 2

before:
  hooks:
    - go mod download
    - go generate ./...

builds:
  - id: sclient
    binary: sclient
    main: ./cmd/sclient/
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - freebsd
      - windows
      - js
    goarch:
      - amd64
      - arm
      - arm64
      - wasm
    goarm:
      - 7
    goamd64:
      - v2
    ignore:
      - goos: windows
        goarch: 386
      - goos: windows
        goarm: 6
      - goos: windows
        goarm: 7

  - id: ssh-tls-proxy
    binary: ssh-tls-proxy
    main: ./cmd/ssh-tls-proxy/
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - freebsd
      - windows
    goarch:
      - amd64
      - arm
      - arm64
    goarm:
      - 7
    goamd64:
      - v2
    ignore:
      - goos: windows
        goarch: 386
      - goos: windows
        goarm: 6
      - goos: windows
        goarm: 7

archives:
  - id: sclient-binary
    formats: [tar.xz]
    format_overrides:
      - goos: windows
        formats: [zip]

  - id: ssh-tls-proxy-binary
    formats: [tar.xz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
